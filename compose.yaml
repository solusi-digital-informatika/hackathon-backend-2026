name: ai-production-workflow

services:
  web:
    build:
      context: ../frontend/hackathon-frontend-2026
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aioffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aioffice}
      POSTGRES_DB: aioffice
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioffice -d aioffice"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://aioffice:${POSTGRES_PASSWORD:-aioffice}@db:5432/aioffice
      MOODBOARD_STORAGE_DIR: /app/data/moodboards
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}'
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - moodboard_data:/app/data/moodboards
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: aioffice
      POSTGRES_PASSWORD: aioffice
      POSTGRES_DB: aioffice_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioffice -d aioffice_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  test:
    build:
      context: .
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://aioffice:aioffice@db-test:5432/aioffice_test
      TEST_DATABASE_URL: postgresql+psycopg://aioffice:aioffice@db-test:5432/aioffice_test
      MOODBOARD_STORAGE_DIR: /tmp/moodboards
    depends_on:
      db-test:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

volumes:
  postgres_data:
  moodboard_data:
